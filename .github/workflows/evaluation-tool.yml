name: evaluation-tool

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'tools/evaluation/**'
      - '.github/workflows/evaluation-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run evaluation tool tests
        working-directory: tools/evaluation
        run: python3 -m unittest -v test_evaluate.py
