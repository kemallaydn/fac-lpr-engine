name: foundation-build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            config: Debug
            preset: linux-gcc-debug
          - compiler: gcc
            config: Release
            preset: linux-gcc-release
          - compiler: clang
            config: Debug
            preset: linux-clang-debug
          - compiler: clang
            config: Release
            preset: linux-clang-release
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

  windows:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-msvc-debug
          - config: Release
            preset: windows-msvc-release
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel
