name: synthetic-ocr-fixtures

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'tools/synthetic-plates/**'
      - '.github/workflows/synthetic-ocr-fixtures.yml'
  push:
    branches: [dev]
    paths:
      - 'tools/synthetic-plates/**'
      - '.github/workflows/synthetic-ocr-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fixtures:
    # GitHub-hosted runner only; independent of FAC_LPR_HOSTED_CI_ENABLED.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency and font
        run: |
          python -m pip install 'Pillow==11.3.0'
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Check generator and deterministic PNG fixtures
        run: python -m unittest discover -s tools/synthetic-plates -p 'test_*.py' -v
      - name: Generate labelled fixtures
        run: python tools/synthetic-plates/generate.py --out artifacts/synthetic-plates
      - name: Upload synthetic PNGs and known-truth manifest
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ocr-fixtures
          path: artifacts/synthetic-plates/
          retention-days: 14
          if-no-files-found: error


# This checks fixture generation only. It does not claim that YOLO, LPRNet,
# PaddleOCR or character fusion recognize these fixtures correctly.
# Real-model accuracy must be evaluated separately with tools/evaluation.
