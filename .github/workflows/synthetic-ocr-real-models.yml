name: synthetic-ocr-real-models

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'tools/synthetic-plates/**'
      - 'tools/paddle-worker/worker.py'
      - 'tools/ocr-compare/**'
      - 'models/**'
      - 'docs/lpr-cli-contract.example'
      - '.github/workflows/synthetic-ocr-real-models.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'tools/synthetic-plates/**'
      - 'tools/paddle-worker/worker.py'
      - 'tools/ocr-compare/**'
      - 'models/**'
      - 'docs/lpr-cli-contract.example'
      - '.github/workflows/synthetic-ocr-real-models.yml'

permissions:
  contents: read

jobs:
  real-ocr-compare:
    # Always run on GitHub-hosted Linux. No self-hosted runner or skip flag.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model inference and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' 'Pillow==11.3.0' \
            'opencv-python-headless==4.11.0.86' 'onnxruntime==1.22.1' \
            'paddlepaddle==3.2.0' 'paddleocr==3.3.0'
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Verify real model sizes and SHA-256
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path("tools/ocr-compare/compare_real_ocr.py")
          spec = importlib.util.spec_from_file_location("compare_real_ocr", p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          conf = mod.parse_contract(Path("docs/lpr-cli-contract.example"))
          print("LPRNet sha256:", mod.validate_model(Path("models") / conf["ocr.model"], conf))
          PY
      - name: Test comparison logic and synthetic fixture generation
        run: |
          python -m unittest discover -s tools/ocr-compare -p 'test_*.py' -v
          python -m unittest discover -s tools/synthetic-plates -p 'test_*.py' -v
      - name: Generate 32 known-label plate crops
        run: python tools/synthetic-plates/generate.py --out artifacts/ocr-crops
      - name: Compile real-inference native C++ decision harness
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tools/ocr-compare/native_policy_replay.cpp \
            src/application/candidate_fusion.cpp \
            src/application/safe_decision_policy.cpp \
            src/application/turkish_plate_grammar.cpp \
            -o /tmp/native-policy-replay
      - name: Run actual LPRNet ONNX and PaddleOCR predictions
        run: |
          python tools/ocr-compare/compare_real_ocr.py \
            --fixture-dir artifacts/ocr-crops \
            --model-dir models \
            --contract docs/lpr-cli-contract.example \
            --native-input artifacts/ocr-reports/native-input.tsv \
            --json-out artifacts/ocr-reports/compare.json \
            --md-out artifacts/ocr-reports/compare.md
      - name: Apply actual C++ fusion and decision policy to all real-model outputs
        run: |
          /tmp/native-policy-replay \
            artifacts/ocr-reports/native-input.tsv \
            artifacts/ocr-reports/native-policy.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads(Path("artifacts/ocr-reports/native-policy.json").read_text())
          keys = ("lprnetGreedyCorrect", "paddleCorrect", "acceptedCorrect",
                  "acceptedWrong", "reviewCorrect", "reviewWrong", "rejected",
                  "reviewSuggestionCorrect", "reviewSuggestionWrong")
          summary = "# Actual C++ decision policy on 32 synthetic crops\n\n"
          summary += "Real OCR inference, native C++ replay. NOT YOLO/camera E2E or beam-search accuracy.\n\n"
          summary += "| Metric | Count / 32 |\n|---|---:|\n"
          summary += "".join("| %s | %s / 32 |\n" % (k, r[k]) for k in keys)
          Path("artifacts/ocr-reports/native-policy.md").write_text(summary)
          print(summary)
          if "GITHUB_STEP_SUMMARY" in os.environ:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write(summary)
          PY
      - name: Upload inference results (not a synthetic generator pass)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ocr-synthetic-crop-comparison
          path: artifacts/ocr-reports/
          if-no-files-found: warn
          retention-days: 14
