name: performance-regression

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    branches: [dev]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: performance-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: '1'
  WARMUP: '10'
  ITERATIONS: '50'
  REPEATS: '2'
  LATENCY_TOLERANCE_PERCENT: '15'
  THROUGHPUT_TOLERANCE_PERCENT: '12'

jobs:
  linux-x64:
    runs-on: [self-hosted, macOS, ARM64, fac-lpr]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine whether runtime performance can change
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR run: benchmark required to publish/refresh the dev baseline."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$changed_files"

          if printf '%s\n' "$changed_files" | grep -Eq '^(src/|include/|tools/benchmark/|cmake/|models/|CMakeLists\.txt$|vcpkg\.json$|vcpkg-configuration\.json$|scripts/bootstrap-dependencies\.sh$|docs/lpr-cli-contract\.example$|tests/fixtures/real/plate_01\.jpg$)'; then
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
            echo "Performance-sensitive files changed; running benchmark gate."
          else
            echo "run_benchmark=false" >> "$GITHUB_OUTPUT"
            echo "No performance-sensitive runtime files changed; skipping expensive benchmark gate."
          fi

      - name: Skip benchmark for non-runtime PR
        if: steps.impact.outputs.run_benchmark != 'true'
        shell: bash
        run: |
          echo "Performance benchmark skipped: this PR does not change runtime-sensitive paths."

      - name: Docker amd64 preflight
        if: steps.impact.outputs.run_benchmark == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker run --rm --platform linux/amd64 ubuntu:24.04 bash -lc '
            set -euo pipefail
            test "$(uname -s)" = "Linux"
            test "$(uname -m)" = "x86_64"
            uname -a
          '

      - name: Prepare persistent vcpkg binary cache
        if: steps.impact.outputs.run_benchmark == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cache/fac-lpr-vcpkg"

      - name: Build and run repeated Linux x64 benchmark samples
        if: steps.impact.outputs.run_benchmark == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/amd64 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.cache/fac-lpr-vcpkg:/vcpkg-cache" \
            -w /workspace \
            -e FAC_LPR_CI_RUN_ID="${GITHUB_RUN_ID}" \
            -e WARMUP="${WARMUP}" \
            -e ITERATIONS="${ITERATIONS}" \
            -e REPEATS="${REPEATS}" \
            -e VCPKG_DISABLE_METRICS=1 \
            -e VCPKG_DEFAULT_TRIPLET=x64-linux \
            -e VCPKG_BINARY_SOURCES='clear;files,/vcpkg-cache,readwrite' \
            ubuntu:24.04 bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              PERF_ROOT="/workspace/build/perf-${FAC_LPR_CI_RUN_ID}"
              BUILD_DIR="${PERF_ROOT}/build"
              VCPKG_ROOT="${PERF_ROOT}/vcpkg"
              VCPKG_INSTALLED="${PERF_ROOT}/vcpkg_installed"
              CURRENT_DIR="${PERF_ROOT}/current"
              export VCPKG_ROOT
              export FAC_LPR_VCPKG_INSTALLED_DIR="${VCPKG_INSTALLED}"

              rm -rf "${PERF_ROOT}"
              mkdir -p "${PERF_ROOT}" "${CURRENT_DIR}"

              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build git curl ca-certificates \
                zip unzip tar pkg-config python3 autoconf automake libtool perl nasm yasm

              bash scripts/bootstrap-dependencies.sh

              cmake -S . -B "${BUILD_DIR}" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DVCPKG_INSTALLED_DIR="${VCPKG_INSTALLED}" \
                -DVCPKG_TARGET_TRIPLET=x64-linux \
                -DFAC_LPR_ONNXRUNTIME_ROOT=/workspace/build/deps/onnxruntime \
                -DFAC_LPR_WITH_ONNX_RUNTIME=ON \
                -DFAC_LPR_WITH_OPENCV=ON \
                -DFAC_LPR_BUILD_BENCHMARK=ON

              cmake --build "${BUILD_DIR}" --target fac-lpr-benchmark --parallel 2

              export LD_LIBRARY_PATH="/workspace/build/deps/onnxruntime/lib:${BUILD_DIR}/artifacts/lib:${LD_LIBRARY_PATH:-}"
              for run in $(seq 1 "$REPEATS"); do
                "${BUILD_DIR}/artifacts/bin/fac-lpr-benchmark" \
                  tests/fixtures/real/plate_01.jpg \
                  --model-dir models \
                  --config docs/lpr-cli-contract.example \
                  --warmup "$WARMUP" \
                  --iterations "$ITERATIONS" \
                  --report "${CURRENT_DIR}/run-${run}.json"
              done
            '

      - name: Publish dev baseline snapshot
        if: steps.impact.outputs.run_benchmark == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-linux-x64-${{ github.sha }}
          path: build/perf-${{ github.run_id }}/current/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Resolve latest successful dev baseline
        if: steps.impact.outputs.run_benchmark == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          PERF_ROOT="build/perf-${GITHUB_RUN_ID}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          api_version_header="X-GitHub-Api-Version: 2022-11-28"

          runs_json=$(curl --fail --silent --show-error \
            -H "$auth_header" -H "$accept_header" -H "$api_version_header" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/actions/workflows/performance-regression.yml/runs?branch=dev&event=push&status=success&per_page=20")
          run_id=$(printf '%s' "$runs_json" | python3 -c 'import json,sys; data=json.load(sys.stdin); runs=data.get("workflow_runs", []); print(runs[0]["id"] if runs else "")')
          if [[ -z "$run_id" ]]; then
            echo "No successful dev performance baseline exists. Run the workflow on dev first." >&2
            exit 3
          fi

          artifacts_json=$(curl --fail --silent --show-error \
            -H "$auth_header" -H "$accept_header" -H "$api_version_header" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")
          artifact_id=$(printf '%s' "$artifacts_json" | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[a for a in data.get("artifacts", []) if a.get("name", "").startswith("performance-baseline-linux-x64-") and not a.get("expired", False)]; print(matches[0]["id"] if matches else "")')
          if [[ -z "$artifact_id" ]]; then
            echo "Baseline workflow has no non-expired benchmark artifact." >&2
            exit 4
          fi

          mkdir -p "${PERF_ROOT}/baseline"
          curl --fail --silent --show-error --location \
            -H "$auth_header" -H "$accept_header" -H "$api_version_header" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "${PERF_ROOT}/baseline.zip"
          unzip -q "${PERF_ROOT}/baseline.zip" -d "${PERF_ROOT}/baseline"
          echo "BASELINE_RUN_ID=${run_id}" >> "$GITHUB_ENV"

      - name: Compare P50/P95/P99 and throughput
        if: steps.impact.outputs.run_benchmark == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PERF_ROOT="build/perf-${GITHUB_RUN_ID}"
          python3 scripts/compare_benchmark.py \
            --baseline "${PERF_ROOT}"/baseline/*.json \
            --current "${PERF_ROOT}"/current/*.json \
            --latency-tolerance-percent "$LATENCY_TOLERANCE_PERCENT" \
            --throughput-tolerance-percent "$THROUGHPUT_TOLERANCE_PERCENT" \
            --output "${PERF_ROOT}/performance-regression.json"

      - name: Upload current benchmark and comparison
        if: always() && steps.impact.outputs.run_benchmark == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-linux-x64-${{ github.sha }}
          path: |
            build/perf-${{ github.run_id }}/current/*.json
            build/perf-${{ github.run_id }}/performance-regression.json
          if-no-files-found: warn
          retention-days: 30
