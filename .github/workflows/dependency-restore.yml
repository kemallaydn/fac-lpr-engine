name: dependency-restore

on:
  push:
    branches: [dev]
    paths:
      - 'vcpkg.json'
      - 'cmake/vcpkg-baseline.txt'
      - 'scripts/bootstrap-dependencies.*'
      - 'tools/model-inspector/**'
      - 'include/fac_lpr/application/logging.hpp'
      - 'include/fac_lpr/infrastructure/spdlog_logger.hpp'
      - 'include/fac_lpr/infrastructure/onnx/**'
      - 'src/infrastructure/spdlog_logger.cpp'
      - 'src/infrastructure/onnx/**'
      - 'src/infrastructure/CMakeLists.txt'
      - 'CMakeLists.txt'
      - '.github/workflows/dependency-restore.yml'

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: '1'

jobs:
  linux:
    name: Linux dependency build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-baseline.txt') }}
      - name: Restore dependencies
        run: bash scripts/bootstrap-dependencies.sh
      - name: Configure dependency-backed targets
        run: >-
          cmake -S . -B build/native-deps -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/.tools/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/vcpkg_installed
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DFAC_LPR_WITH_SPDLOG=ON
          -DFAC_LPR_WITH_ONNX_RUNTIME=ON
          -DFAC_LPR_BUILD_MODEL_INSPECTOR=ON
      - name: Build dependency-backed targets
        run: cmake --build build/native-deps --config Release --parallel 2

  windows:
    name: Windows dependency build
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-baseline.txt') }}
      - name: Restore dependencies
        shell: pwsh
        run: ./scripts/bootstrap-dependencies.ps1
      - name: Configure dependency-backed targets
        shell: pwsh
        run: >-
          cmake -S . -B build/native-deps -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.tools/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/build/vcpkg_installed"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DFAC_LPR_WITH_SPDLOG=ON
          -DFAC_LPR_WITH_ONNX_RUNTIME=ON
          -DFAC_LPR_BUILD_MODEL_INSPECTOR=ON
      - name: Build dependency-backed targets
        shell: pwsh
        run: cmake --build build/native-deps --config Release --parallel 2
