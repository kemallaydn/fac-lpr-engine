name: dependency-security

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: '1'
  VCPKG_DEFAULT_TRIPLET: arm64-osx

jobs:
  security-gate:
    name: Dependency security gate
    runs-on: [self-hosted, macOS, ARM64, fac-lpr]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Ensure security tools
        shell: bash
        run: |
          set -euo pipefail
          command -v brew >/dev/null
          brew list syft >/dev/null 2>&1 || brew install syft
          brew list grype >/dev/null 2>&1 || brew install grype

      - name: Restore pinned dependencies
        shell: bash
        run: bash scripts/bootstrap-dependencies.sh

      - name: Generate dependency inventory and CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          .tools/vcpkg/vcpkg list > artifacts/security/vcpkg-inventory.txt
          printf 'onnxruntime-version=' > artifacts/security/runtime-inventory.txt
          cat cmake/onnxruntime-version.txt >> artifacts/security/runtime-inventory.txt
          syft dir:. -o cyclonedx-json=artifacts/security/sbom.cdx.json

      - name: Scan SBOM and fail on High/Critical
        shell: bash
        run: |
          set -euo pipefail
          grype sbom:artifacts/security/sbom.cdx.json \
            --config security/grype.yaml \
            --fail-on high \
            -o json > artifacts/security/grype.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.run_id }}
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 30
